services:
  swiftride:
    build: .
    image: swiftride:latest
    container_name: swiftride
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Comma-separated browser origins allowed to call the API from another origin.
      # Same-origin use (the container serving the site itself) needs no entry.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      # Set to 1 to create the demo accounts on first boot.
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - swiftride-data:/data
    restart: unless-stopped

volumes:
  swiftride-data:
