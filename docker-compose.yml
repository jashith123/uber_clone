services:
  swiftride:
    build: .
    image: swiftride:latest
    container_name: swiftride
    ports:
      - "4000:4000"
    environment:
      # Leave empty and the server generates a strong secret on first boot and
      # keeps it in the data volume.
      JWT_SECRET: ${JWT_SECRET:-}
      # Comma-separated browser origins allowed to call the API from another origin.
      # Same-origin use (the container serving the site itself) needs no entry.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      # Demo accounts are created on an empty database. Set SEED_DEMO=0 to skip
      # them, and DEMO_PASSWORD to replace the well-known default.
      SEED_DEMO: ${SEED_DEMO:-1}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - swiftride-data:/data
    restart: unless-stopped

volumes:
  swiftride-data:
